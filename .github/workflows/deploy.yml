name: Deploy zu GitHub Pages

on:
  push:
    branches: [claude/vacation-search-app-yy24gw, main]
  schedule:
    # Täglich 04:23 UTC: echte Flugpreise aktualisieren und neu veröffentlichen
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Tests ausführen
        run: npm test
      - name: Echte Flugpreise laden (Travelpayouts/Aviasales)
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: node --experimental-strip-types scripts/fetch-prices.mjs
      - name: Produktions-Build
        run: npm run build
      - name: Auf gh-pages-Branch veröffentlichen
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
